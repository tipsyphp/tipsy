name: CI

on:
  push:
    branches: [master, main, v2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} / ${{ matrix.db }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        db: ['pgsql', 'mysql']
        include:
          # Attach coverage only to the default Postgres cell
          - php: '8.3'
            db: 'pgsql'
            coverage: true

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: tipsy
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tipsy
          POSTGRES_USER: postgres
          # Trust auth for ephemeral CI — avoids hardcoded password secrets scanners.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB: ${{ matrix.db }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: ${{ matrix.coverage && 'xdebug' || 'none' }}
          ini-values: short_open_tag=On
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-
            ${{ runner.os }}-php-composer-

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Start built-in server
        run: php -S 127.0.0.1:8000 -t tests/web > /tmp/tipsy-php-server.log 2>&1 &

      - name: Wait for built-in server
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:8000/" >/dev/null 2>&1 || curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000/" | grep -Eq '^[0-9]+$'; then
              exit 0
            fi
            sleep 0.2
          done
          echo "PHP built-in server failed to start" >&2
          cat /tmp/tipsy-php-server.log >&2 || true
          exit 1

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: composer test

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        env:
          XDEBUG_MODE: coverage
        run: composer test:coverage

      - name: Upload coverage to Codecov
        if: ${{ matrix.coverage }}
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: build/logs/clover.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
